name: Market Insight AI V4 Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Scaffold & Assemble Android APK
        shell: bash
        run: |
          set -e
          
          # Prepare dist folder using root index.html
          mkdir -p dist
          cp index.html dist/

          # Run Capacitor Android Packaging
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 --no-audit --no-fund --legacy-peer-deps
          npx cap init "Market Insight AI" "com.marketinsight.ai" --web-dir "dist"
          npx cap add android
          npx cap sync android

          # Compile APK
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Collect Binaries
        shell: bash
        run: |
          set -e
          mkdir -p release_binaries
          cp android/app/build/outputs/apk/debug/*.apk release_binaries/MarketInsightAI-v4.0.apk
          cd release_binaries
          sha256sum *.apk > SHA256SUMS.txt

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarketInsightAI-v4.0-Android-APK
          path: |
            release_binaries/*.apk
            release_binaries/SHA256SUMS.txt
          retention-days: 14
