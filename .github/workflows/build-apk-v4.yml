name: Market Insight AI V4 Build

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Compile Application
        shell: bash
        run: |
          set -e
          
          # Fix script line endings if any exist
          find . -type f -name "*.sh" -exec sed -i 's/\r$//' {} + 2>/dev/null || true

          # 1. Build Web Assets
          if [ -f "package.json" ]; then
            npm install --legacy-peer-deps || npm install
            npm run build 2>/dev/null || true
          fi

          WEB_DIR="dist"
          if [ -d "build" ]; then WEB_DIR="build"; fi
          if [ -d "www" ]; then WEB_DIR="www"; fi
          mkdir -p "$WEB_DIR"

          if [ ! -f "$WEB_DIR/index.html" ]; then
            if [ -f "index.html" ]; then
              cp index.html "$WEB_DIR/"
            else
              echo '<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Market Insight AI</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-[#07090e] text-white"><div id="root"></div></body></html>' > "$WEB_DIR/index.html"
            fi
          fi

          # 2. Capacitor Scaffolding without custom Java plugin crash
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 --no-audit --no-fund --legacy-peer-deps
          npx cap init "Market Insight AI" "com.marketinsight.ai" --web-dir "$WEB_DIR"
          npx cap add android
          npx cap sync android

          # 3. Assemble Android APK
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Collect Output Binaries
        shell: bash
        run: |
          set -e
          mkdir -p release_binaries
          
          APKS=$(find android/app/build/outputs/apk/ -type f -name "*.apk")

          if [ -z "$APKS" ]; then
            echo "ERROR: Gradle failed to output APK"
            exit 1
          fi

          for apk in $APKS; do
            cp "$apk" release_binaries/MarketInsightAI-v4.0.apk
          done

          cd release_binaries
          sha256sum *.apk > SHA256SUMS.txt
          ls -lh

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarketInsightAI-v4.0-Android-APK
          path: |
            release_binaries/*.apk
            release_binaries/SHA256SUMS.txt
          retention-days: 14
