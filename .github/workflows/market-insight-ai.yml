name: Market Insight AI V2.1 Build Now

on:
  workflow_dispatch: # Trigger manually from your phone via the GitHub mobile app

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MI_KEYSTORE_PATH: ${{ github.workspace }}/ci-release.jks
      MI_KEYSTORE_PASSWORD: ci-market-insight-2026
      MI_KEY_ALIAS: market-insight
      MI_KEY_PASSWORD: ci-market-insight-2026
      MARKET_INSIGHT_API_BASE_URL: https://market-insight-api-v21-production.up.railway.app/
      MARKET_INSIGHT_WS_BASE_URL: wss://market-insight-api-v21-production.up.railway.app/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Inspect Workspace Structure
        shell: bash
        run: |
          echo "=== Root Repository Layout ==="
          ls -la
          echo "=== Searching for project build files ==="
          find . -maxdepth 3 -not -path '*/.*'

      - name: Test Backend Health
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request
          base = "https://market-insight-api-v21-production.up.railway.app"
          try:
              with urllib.request.urlopen(base + "/health", timeout=15) as r:
                  health = json.load(r)
              print("Backend Health Check:", health)
          except Exception as e:
              print("Backend warning:", e)
          PY

      - name: Install Python Dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          
          # Install dependencies dynamically whether at root or in a subfolder
          if [ -d "project" ] && [ -f "project/setup.py" ]; then
            python -m pip install -e './project/backend[dev]' 2>/dev/null || python -m pip install -e './project' 2>/dev/null || true
          elif [ -f "setup.py" ] || [ -f "pyproject.toml" ]; then
            python -m pip install -e './backend[dev]' 2>/dev/null || python -m pip install -e '.' 2>/dev/null || true
          fi

          if [ -f "project/requirements.txt" ]; then
            python -m pip install -r project/requirements.txt 2>/dev/null || true
          elif [ -f "requirements.txt" ]; then
            python -m pip install -r requirements.txt 2>/dev/null || true
          fi

      - name: Generate CI Signing Keystore
        shell: bash
        run: |
          mkdir -p "${{ github.workspace }}/android"
          if [ -d "${{ github.workspace }}/project" ]; then
            mkdir -p "${{ github.workspace }}/project/android"
          fi
          keytool -genkeypair -v \
            -keystore "$MI_KEYSTORE_PATH" \
            -storepass "$MI_KEYSTORE_PASSWORD" \
            -alias "$MI_KEY_ALIAS" \
            -keypass "$MI_KEY_PASSWORD" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Market Insight AI V2.1 CI, OU=Build, O=Market Insight AI, L=New York, ST=NY, C=US"

      - name: Locate and Execute Build Script
        shell: bash
        run: |
          # Convert Windows CRLF line endings to Linux LF across all scripts
          find . -type f -name "*.sh" -exec sed -i 's/\r$//' {} + 2>/dev/null || true

          # Search for verify_release.sh anywhere in the repo
          SCRIPT_PATH=$(find . -name "verify_release.sh" -type f | head -n 1)

          if [ -n "$SCRIPT_PATH" ]; then
            echo "Found verify_release.sh at: $SCRIPT_PATH"
            chmod +x "$SCRIPT_PATH"
            
            # Navigate to the parent folder of scripts/ and run verify_release.sh
            SCRIPT_DIR=$(dirname "$SCRIPT_PATH")
            PARENT_DIR=$(dirname "$SCRIPT_DIR")
            
            echo "Changing directory to $PARENT_DIR and running verify_release.sh..."
            cd "$PARENT_DIR"
            ./scripts/verify_release.sh
            cd "$GITHUB_WORKSPACE"

          else
            echo "verify_release.sh not found. Searching for Gradle wrapper (gradlew)..."
            GRADLE_PATH=$(find . -name "gradlew" -type f | head -n 1)
            
            if [ -n "$GRADLE_PATH" ]; then
              echo "Found gradlew at: $GRADLE_PATH"
              chmod +x "$GRADLE_PATH"
              GRADLE_DIR=$(dirname "$GRADLE_PATH")
              cd "$GRADLE_DIR"
              ./gradlew assembleDebug assembleRelease || ./gradlew assembleDebug
              cd "$GITHUB_WORKSPACE"
            else
              echo "ERROR: Neither verify_release.sh nor gradlew found in repository!"
              exit 1
            fi
          fi

      - name: Collect and Verify APK Artifacts
        shell: bash
        run: |
          mkdir -p dist

          echo "Searching for generated APK files..."
          APK_FILES=$(find . -name "*.apk" -type f -not -path '*/.*')

          if [ -z "$APK_FILES" ]; then
            echo "ERROR: No .apk files were produced during the build step!"
            exit 1
          fi

          echo "Found APK files:"
          echo "$APK_FILES"

          # Copy found APKs into root dist/ folder
          for apk in $APK_FILES; do
            echo "Copying $apk to dist/"
            cp "$apk" dist/ 2>/dev/null || true
          done

          # Validate APK binary sizes (>100KB)
          for apk in dist/*.apk; do
            if [ -f "$apk" ]; then
              SIZE=$(stat -c%s "$apk" 2>/dev/null || stat -f%z "$apk" 2>/dev/null)
              echo "$apk - Size: $SIZE bytes"
              if [ "$SIZE" -lt 100000 ]; then
                echo "ERROR: $apk is too small ($SIZE bytes). It is not a valid compiled APK!"
                exit 1
              fi
            fi
          done

          cd dist
          sha256sum *.apk > SHA256SUMS.txt
          echo "=== Final APK Build Outputs ==="
          ls -lh
          cat SHA256SUMS.txt

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MarketInsightAI-v2.1-APK
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
          retention-days: 14
