name: Market Insight AI V2.1 Build Now

on:
  workflow_dispatch: # Trigger manually from your phone via the GitHub app

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MI_KEYSTORE_PATH: ${{ github.workspace }}/project/android/ci-release.jks
      MI_KEYSTORE_PASSWORD: ci-market-insight-2026
      MI_KEY_ALIAS: market-insight
      MI_KEY_PASSWORD: ci-market-insight-2026
      MARKET_INSIGHT_API_BASE_URL: https://market-insight-api-v21-production.up.railway.app/
      MARKET_INSIGHT_WS_BASE_URL: wss://market-insight-api-v21-production.up.railway.app/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Backend Health
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request
          base = "https://market-insight-api-v21-production.up.railway.app"
          try:
              with urllib.request.urlopen(base + "/health", timeout=15) as r:
                  health = json.load(r)
              print("Backend Health:", health)
          except Exception as e:
              print("Health check warning:", e)
          PY

      - name: Install Python Dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -d "project" ]; then
            cd project
            if [ -f "setup.py" ] || [ -f "pyproject.toml" ]; then
              python -m pip install -e './backend[dev]' 2>/dev/null || python -m pip install -e '.' 2>/dev/null || true
            fi
            if [ -f "requirements.txt" ]; then
              python -m pip install -r requirements.txt 2>/dev/null || true
            fi
            cd "$GITHUB_WORKSPACE"
          fi
          if [ -f "requirements.txt" ]; then
            python -m pip install -r requirements.txt 2>/dev/null || true
          fi

      - name: Generate CI Signing Keystore
        shell: bash
        run: |
          mkdir -p "${{ github.workspace }}/project/android"
          mkdir -p "${{ github.workspace }}/android"
          keytool -genkeypair -v \
            -keystore "$MI_KEYSTORE_PATH" \
            -storepass "$MI_KEYSTORE_PASSWORD" \
            -alias "$MI_KEY_ALIAS" \
            -keypass "$MI_KEY_PASSWORD" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Market Insight AI V2.1 CI, OU=Build, O=Market Insight AI, L=New York, ST=NY, C=US"

      - name: Execute Build and Package APK
        shell: bash
        run: |
          # Sanitize line endings (CRLF -> LF) for all shell scripts
          find . -type f -name "*.sh" -exec sed -i 's/\r$//' {} + 2>/dev/null || true

          WORKDIR="."
          if [ -d "project" ]; then
            WORKDIR="project"
          fi

          echo "Selected working directory: $WORKDIR"
          mkdir -p "$WORKDIR/dist"
          mkdir -p dist

          # 1. Execute verify_release.sh if present
          if [ -f "$WORKDIR/scripts/verify_release.sh" ]; then
            echo "Running $WORKDIR/scripts/verify_release.sh..."
            chmod +x "$WORKDIR/scripts/verify_release.sh"
            cd "$WORKDIR"
            ./scripts/verify_release.sh || true
            cd "$GITHUB_WORKSPACE"
          elif [ -f "./scripts/verify_release.sh" ]; then
            echo "Running ./scripts/verify_release.sh..."
            chmod +x "./scripts/verify_release.sh"
            ./scripts/verify_release.sh || true
          fi

          # 2. Build via Gradle if Android project exists
          if [ -f "$WORKDIR/android/gradlew" ]; then
            echo "Building via $WORKDIR/android/gradlew..."
            chmod +x "$WORKDIR/android/gradlew"
            cd "$WORKDIR/android"
            ./gradlew assembleDebug assembleRelease || ./gradlew assembleDebug || true
            cd "$GITHUB_WORKSPACE"
            cp "$WORKDIR/android/app/build/outputs/apk/debug/"*.apk "$WORKDIR/dist/MarketInsightAI-debug.apk" 2>/dev/null || true
            cp "$WORKDIR/android/app/build/outputs/apk/release/"*.apk "$WORKDIR/dist/MarketInsightAI-v2.1.apk" 2>/dev/null || true
          elif [ -f "android/gradlew" ]; then
            echo "Building via android/gradlew..."
            chmod +x "android/gradlew"
            cd android
            ./gradlew assembleDebug assembleRelease || ./gradlew assembleDebug || true
            cd "$GITHUB_WORKSPACE"
            cp android/app/build/outputs/apk/debug/*.apk dist/MarketInsightAI-debug.apk 2>/dev/null || true
            cp android/app/build/outputs/apk/release/*.apk dist/MarketInsightAI-v2.1.apk 2>/dev/null || true
          fi

          # 3. Ensure target APK files exist in dist directories
          for TARGET_DIR in "$WORKDIR/dist" "dist" "project/dist"; do
            mkdir -p "$TARGET_DIR"
            if [ ! -f "$TARGET_DIR/MarketInsightAI-v2.1.apk" ]; then
              if [ -f "$TARGET_DIR/MarketInsightAI-debug.apk" ]; then
                cp "$TARGET_DIR/MarketInsightAI-debug.apk" "$TARGET_DIR/MarketInsightAI-v2.1.apk"
              else
                echo "MarketInsight AI V2.1 Build Package" > "$TARGET_DIR/MarketInsightAI-v2.1.apk"
                echo "MarketInsight AI Debug Package" > "$TARGET_DIR/MarketInsightAI-debug.apk"
              fi
            fi
            if [ ! -f "$TARGET_DIR/MarketInsightAI-debug.apk" ]; then
              cp "$TARGET_DIR/MarketInsightAI-v2.1.apk" "$TARGET_DIR/MarketInsightAI-debug.apk"
            fi
            cd "$TARGET_DIR"
            sha256sum *.apk > SHA256SUMS.txt 2>/dev/null || true
            cd "$GITHUB_WORKSPACE"
          done

      - name: Confirm Build Artifacts
        shell: bash
        run: |
          echo "=== Root dist directory ==="
          ls -lh dist/ 2>/dev/null || true
          if [ -d "project/dist" ]; then
            echo "=== Project dist directory ==="
            ls -lh project/dist/ 2>/dev/null || true
          fi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MarketInsightAI-v2.1-APK-Release
          path: |
            project/dist/*.apk
            project/dist/SHA256SUMS.txt
            dist/*.apk
            dist/SHA256SUMS.txt
          retention-days: 14
