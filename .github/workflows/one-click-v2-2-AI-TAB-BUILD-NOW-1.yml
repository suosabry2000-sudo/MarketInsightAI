        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install backend test dependencies
        working-directory: project
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './backend[dev]'

      - name: Generate CI signing keystore
        shell: bash
        run: |
          keytool -genkeypair -v             -keystore "$MI_KEYSTORE_PATH"             -storepass "$MI_KEYSTORE_PASSWORD"             -alias "$MI_KEY_ALIAS"             -keypass "$MI_KEY_PASSWORD"             -keyalg RSA -keysize 2048 -validity 10000             -dname "CN=Market Insight AI V2.1 CI, OU=Build, O=Market Insight AI, L=New York, ST=NY, C=US"

      - name: Verify and build V2.1
        working-directory: project
        shell: bash
        run: ./scripts/verify_release.sh

      - name: Confirm APK outputs
        shell: bash
        run: |
          test -s project/dist/MarketInsightAI-v2.1.apk
          test -s project/dist/MarketInsightAI-debug.apk
          test -s project/dist/SHA256SUMS.txt
          echo "=== V2.1 APKs ==="
          ls -lh project/dist/
          cat project/dist/SHA256SUMS.txt

      - name: Upload V2.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: MarketInsightAI-v2.1-full-universe
          path: |
            project/dist/MarketInsightAI-v2.1.apk
            project/dist/MarketInsightAI-debug.apk
            project/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
