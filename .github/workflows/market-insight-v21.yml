    private String extractTableName(String sql) {
        sql = sql.toLowerCase();
        int idx = sql.indexOf("from");
        if (idx != -1) {
            String sub = sql.substring(idx + 4).trim();
            String[] parts = sub.split("\\s+");
            return parts[0].replaceAll("[^a-zA-Z0-9_]", "");
        }
        return "";
    }
