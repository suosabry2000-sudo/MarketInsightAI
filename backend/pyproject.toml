[project]
name = "market-insight-ai-backend"
version = "1.0.0"
description = "Market Insight AI U.S. equities analysis backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.128,<1",
  "uvicorn>=0.48,<1",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.14,<3",
  "httpx>=0.28,<1",
  "numpy>=2.3,<3",
  "pandas>=2.2,<3",
  "exchange-calendars>=4.13,<5",
  "sqlalchemy>=2.0,<3",
  "redis>=5.2,<6",
  "psycopg[binary]>=3.2,<4",
  "websockets>=15,<17",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-asyncio>=1,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-ra"
