      - name: Build static full U.S. symbol catalog
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 3             -A "Mozilla/5.0 MarketInsightAI/2.1"             "https://www.nasdaqtrader.com/dynamic/SymDir/nasdaqlisted.txt"             -o /tmp/nasdaqlisted.txt
          curl -L --fail --retry 5 --retry-delay 3             -A "Mozilla/5.0 MarketInsightAI/2.1"             "https://www.nasdaqtrader.com/dynamic/SymDir/otherlisted.txt"             -o /tmp/otherlisted.txt

          python - <<'PY'
          import json
          from pathlib import Path

          def parse(path, nasdaq):
              lines = [x for x in Path(path).read_text(encoding="utf-8", errors="replace").splitlines() if x.strip()]
              headers = lines[0].split("|")
              out = []
              for line in lines[1:]:
                  if line.startswith("File Creation Time"):
                      continue
                  values = line.split("|")
                  values += [""] * max(0, len(headers) - len(values))
                  row = dict(zip(headers, values))
                  if (row.get("Test Issue") or "N").strip().upper() == "Y":
                      continue
                  if nasdaq:
                      ticker = (row.get("Symbol") or "").strip().upper()
                      company = (row.get("Security Name") or "").strip()
                      exchange = "NASDAQ"
                      etf = (row.get("ETF") or "").strip().upper() == "Y"
                  else:
                      ticker = (row.get("NASDAQ Symbol") or row.get("ACT Symbol") or "").strip().upper()
                      company = (row.get("Security Name") or "").strip()
                      exchange = {
                          "N": "NYSE",
                          "A": "NYSE AMERICAN",
                          "P": "NYSE ARCA",
                          "Z": "CBOE",
                          "V": "IEX",
                      }.get((row.get("Exchange") or "").strip().upper(), "")
                      etf = (row.get("ETF") or "").strip().upper() == "Y"
                  if not ticker or not company or not exchange:
                      continue
                  # Keep symbols that the app can actually route/search.
                  if len(ticker) > 10 or any(ch not in "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.-" for ch in ticker):
                      continue
                  out.append({
                      "ticker": ticker,
                      "company": company,
                      "exchange": exchange,
                      "sector": None,
                      "asset_type": "ETF" if etf else "STOCK",
                  })
              return out

          rows = parse("/tmp/nasdaqlisted.txt", True) + parse("/tmp/otherlisted.txt", False)
          unique = {}
          for row in rows:
              unique.setdefault(row["ticker"], row)
          catalog = [unique[k] for k in sorted(unique)]
          required = {"AAPL", "MSFT", "NVDA", "JPM", "HOOD", "GOLD"}
          present = {x["ticker"] for x in catalog}
          missing = sorted(required - present)
          print("Static catalog total:", len(catalog))
          if len(catalog) < 1000:
              raise SystemExit(f"Catalog too small: {len(catalog)}")
          if missing:
              raise SystemExit(f"Required symbols missing: {missing}")
          Path("backend/app/market_data/static_catalog.json").write_text(
              json.dumps(catalog, ensure_ascii=False, separators=(",", ":")),
              encoding="utf-8",
          )
          PY

          test -s backend/app/market_data/static_catalog.json

      - name: Commit V2.1 backend and static catalog
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          if git diff --cached --quiet; then
            echo "Backend already current."
          else
            git commit -m "deploy: V2.1 full static U.S. stock universe"
            git push
          fi

      - name: Wait for Railway full stock universe
        shell: bash
        run: |
          python - <<'PY'
          import json, time, urllib.request, urllib.parse

          base = "https://market-insight-api-production.up.railway.app"
          deadline = time.time() + 600
          last = None
          while time.time() < deadline:
              try:
                  with urllib.request.urlopen(base + "/health", timeout=20) as r:
                      health = json.load(r)
                  with urllib.request.urlopen(base + "/stocks/catalog?offset=0&limit=1", timeout=30) as r:
                      body = json.load(r)
                  total = int(body.get("total", 0))
                  last = total
                  print("Railway catalog total:", total, flush=True)
                  if health.get("status") == "ok" and total >= 1000:
                      for query in ("JPM", "HOOD", "GOLD"):
                          url = base + "/stocks/search?q=" + urllib.parse.quote(query)
                          with urllib.request.urlopen(url, timeout=20) as r:
                              results = json.load(r).get("results", [])
                          if not results:
                              raise RuntimeError(f"search failed for {query}")
                      print("Railway full universe verified.", flush=True)
                      raise SystemExit(0)
              except SystemExit:
                  raise
              except Exception as exc:
                  print("Waiting for Railway:", type(exc).__name__, str(exc), flush=True)
              time.sleep(15)
          raise SystemExit(f"Railway did not reach >=1000 stocks in time; last total={last}")
          PY

