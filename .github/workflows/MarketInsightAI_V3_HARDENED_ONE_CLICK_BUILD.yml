      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install backend dependencies
        working-directory: project
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './backend[dev]'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Confirm Kotlin compiler
        shell: bash
        run: kotlinc -version

      - name: Generate CI signing keystore
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore "$MI_KEYSTORE_PATH" \
            -storepass "$MI_KEYSTORE_PASSWORD" \
            -alias "$MI_KEY_ALIAS" \
            -keypass "$MI_KEY_PASSWORD" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Market Insight AI V3 CI, OU=Build, O=Market Insight AI, L=New York, ST=NY, C=US"

      - name: Run full V3 verifier
        working-directory: project
        shell: bash
        run: ./scripts/verify_release.sh

      - name: Confirm real APK outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s project/dist/MarketInsightAI-v3.0.apk
          test -s project/dist/MarketInsightAI-debug.apk
          test -s project/dist/SHA256SUMS.txt
          test "$(stat -c%s project/dist/MarketInsightAI-v3.0.apk)" -gt 100000
          ls -lh project/dist
          cat project/dist/SHA256SUMS.txt

      - name: Upload V3 APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MarketInsightAI-v3-hardened
          path: |
            project/dist/MarketInsightAI-v3.0.apk
            project/dist/MarketInsightAI-debug.apk
            project/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
