name: Build Signed Release APK

on:
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Gradlew Execution Permissions
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        uses: r3d-act/signed-build-apk@v2
        id: sign_app
        with:
          copy-project-path: 'app/build/outputs/apk/release/app-release-unsigned.apk'
          alias: ${{ secrets.ALIAS }}
          keystore: ${{ secrets.KEYSTORE }}
          keystore-pass: ${{ secrets.KEYSTORE_PASSWORD }}
          key-pass: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: marketinsight-release-apk
          path: ${{ steps.sign_app.outputs.signed-build-path }}
