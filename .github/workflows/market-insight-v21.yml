package dbms.impl;

import dbms.DBMSServer;
import dbms.QueryCompiler;
import dbms.Table;
import net.sf.jsqlparser.statement.Statement;
import net.sf.jsqlparser.statement.select.Select;
import net.sf.jsqlparser.statement.insert.Insert;
import net.sf.jsqlparser.statement.update.Update;
import net.sf.jsqlparser.statement.delete.Delete;
import net.sf.jsqlparser.statement.CreateTable;
import net.sf.jsqlparser.statement.Drop;
import net.sf.jsqlparser.statement.UseStatement;
import java.io.File;
import java.io.IOException;
import java.io.RandomAccessFile;
import java.nio.ByteBuffer;
import java.nio.channels.FileChannel;
import java.nio.charset.StandardCharsets;
import java.util.*;

public class BytebaseDBMSServer implements DBMSServer {
    private String currentDatabase = null;
    private final String dataDir = "data";
    private final QueryCompiler queryCompiler = new QueryCompiler();

    @Override
    public boolean useDatabase(String dbName) {
        File dbFolder = new File(dataDir, dbName);
        if (dbFolder.exists() && dbFolder.isDirectory()) {
            this.currentDatabase = dbName;
            return true;
        }
        return false;
    }

    @Override
    public String getCurrentDatabase() {
        return currentDatabase;
    }

    @Override
    public Table executeQuery(String query) {
        try {
            Statement stmt = queryCompiler.compile(query);
            if (stmt instanceof Select) {
                return executeSelect((Select) stmt);
            } else if (stmt instanceof Insert) {
                return executeInsert((Insert) stmt);
            } else if (stmt instanceof Update) {
                return executeUpdate((Update) stmt);
            } else if (stmt instanceof Delete) {
                return executeDelete((Delete) stmt);
            } else if (stmt instanceof CreateTable) {
                return executeCreateTable((CreateTable) stmt);
            } else if (stmt instanceof Drop) {
                return executeDrop((Drop) stmt);
            } else if (stmt instanceof UseStatement) {
                return executeUse((UseStatement) stmt);
            } else {
                throw new RuntimeException("Unsupported statement type: " + stmt.getClass().getName());
            }
        } catch (Exception e) {
            throw new RuntimeException("Execution error: " + e.getMessage(), e);
        }
    }

    private Table executeUse(UseStatement stmt) {
        String dbName = stmt.getName();
        if (useDatabase(dbName)) {
            return new Table(List.of("Result"), List.of(List.of("Database changed to " + dbName)));
        } else {
            throw new RuntimeException("Database does not exist: " + dbName);
        }
    }

    private Table executeCreateTable(CreateTable stmt) {
        if (currentDatabase == null) {
            throw new RuntimeException("No database selected");
        }
        String tableName = stmt.getTable().getName();
        File tableFile = new File(new File(dataDir, currentDatabase), tableName + ".tbl");
        if (tableFile.exists()) {
            throw new RuntimeException("Table already exists: " + tableName);
        }

        List<String> columns = new ArrayList<>();
        if (stmt.getColumnDefinitions() != null) {
            stmt.getColumnDefinitions().forEach(col -> columns.add(col.getColumnName()));
        }

        try {
            tableFile.getParentFile().mkdirs();
            try (RandomAccessFile raf = new RandomAccessFile(tableFile, "rw");
                 FileChannel channel = raf.getChannel()) {
                
                // Write header: 4 bytes for column count
                ByteBuffer buffer = ByteBuffer.allocate(1024);
                buffer.putInt(columns.size());
                for (String col : columns) {
                    byte[] colBytes = col.getBytes(StandardCharsets.UTF_8);
                    buffer.putInt(colBytes.length);
                    buffer.put(colBytes);
                }
                // Write initial row count = 0
                buffer.putInt(0);
                buffer.flip();
                channel.write(buffer);
            }
        } catch (IOException e) {
            throw new RuntimeException("Failed to create table file", e);
        }

        return new Table(List.of("Result"), List.of(List.of("Table created successfully")));
    }

    private Table executeDrop(Drop stmt) {
        if (currentDatabase == null) {
            throw new RuntimeException("No database selected");
        }
        if ("TABLE".equalsIgnoreCase(stmt.getType())) {
            String tableName = stmt.getName();
            File tableFile = new File(new File(dataDir, currentDatabase), tableName + ".tbl");
            if (tableFile.exists() && tableFile.delete()) {
                return new Table(List.of("Result"), List.of(List.of("Table dropped successfully")));
            }
            throw new RuntimeException("Table not found: " + tableName);
        }
        throw new RuntimeException("Drop type not supported: " + stmt.getType());
    }

    private Table executeSelect(Select stmt) {
        if (currentDatabase == null) {
            throw new RuntimeException("No database selected");
        }
        // Very basic select parsing or reading from file
        // For standard JSqlParser, we can extract table name from FROM clause
        String sql = stmt.toString();
        String tableName = extractTableName(sql);
        
        List<String> columns = new ArrayList<>();
        List<List<Object>> rows = new ArrayList<>();

        File tableFile = new File(new File(dataDir, currentDatabase), tableName + ".tbl");
        if (!tableFile.exists()) {
            throw new RuntimeException("Table not found: " + tableName);
        }

        try (RandomAccessFile raf = new RandomAccessFile(tableFile, "r");
             FileChannel channel = raf.getChannel()) {
            ByteBuffer buffer = ByteBuffer.allocate((int) channel.size());
            channel.read(buffer);
            buffer.flip();

            int colCount = buffer.getInt();
            for (int i = 0; i < colCount; i++) {
                int len = buffer.getInt();
                byte[] colBytes = new byte[len];
                buffer.get(colBytes);
                columns.add(new String(colBytes, StandardCharsets.UTF_8));
            }

            int rowCount = buffer.getInt();
            for (int r = 0; r < rowCount; r++) {
                List<Object> row = new ArrayList<>();
                for (int c = 0; c < colCount; c++) {
                    int type = buffer.get(); // 0 = null, 1 = string, 2 = int
                    if (type == 1) {
                        int len = buffer.getInt();
                        byte[] valBytes = new byte[len];
                        buffer.get(valBytes);
                        row.add(new String(valBytes, StandardCharsets.UTF_8));
                    } else if (type == 2) {
                        row.add(buffer.getInt());
                    } else {
                        row.add(null);
                    }
                }
                rows.add(row);
            }
        } catch (IOException e) {
            throw new RuntimeException("Error reading table file", e);
        }

        return new Table(columns, rows);
    }

    private Table executeInsert(Insert stmt) {
        if (currentDatabase == null) {
            throw new RuntimeException("No database selected");
        }
        String tableName = stmt.getTable().getName();
        File tableFile = new File(new File(dataDir, currentDatabase), tableName + ".tbl");
        if (!tableFile.exists()) {
            throw new RuntimeException("Table not found: " + tableName);
        }

        // Extract values from insert statement
        List<Object> newRow = new ArrayList<>();
        if (stmt.getItemsList() != null) {
            String items = stmt.getItemsList().toString();
            // strip parentheses
            items = items.replaceAll("^\\(", "").replaceAll("\\)$", "");
            String[] vals = items.split(",");
            for (String val : vals) {
                val = val.trim();
                if (val.startsWith("'") && val.endsWith("'")) {
                    newRow.add(val.substring(1, val.length() - 1));
                } else {
                    try {
                        newRow.add(Integer.parseInt(val));
                    } catch (NumberFormatException e) {
                        newRow.add(val);
                    }
                }
            }
        }

        try {
            // Read existing data, append row, write back
            Table existing = executeSelect(new Select()); // mock select to load
            // Alternatively, just append directly via binary format
            List<String> columns = new ArrayList<>();
            List<List<Object>> rows = new ArrayList<>();
            
            try (RandomAccessFile raf = new RandomAccessFile(tableFile, "rw");
                 FileChannel channel = raf.getChannel()) {
                ByteBuffer readBuf = ByteBuffer.allocate((int) channel.size());
                channel.read(readBuf);
                readBuf.flip();

                int colCount = readBuf.getInt();
                for (int i = 0; i < colCount; i++) {
                    int len = readBuf.getInt();
                    byte[] colBytes = new byte[len];
                    readBuf.get(colBytes);
                    columns.add(new String(colBytes, StandardCharsets.UTF_8));
                }

                int rowCount = readBuf.getInt();
                for (int r = 0; r < rowCount; r++) {
                    List<Object> row = new ArrayList<>();
                    for (int c = 0; c < colCount; c++) {
                        int type = readBuf.get();
                        if (type == 1) {
                            int len = readBuf.getInt();
                            byte[] valBytes = new byte[len];
                            readBuf.get(valBytes);
                            row.add(new String(valBytes, StandardCharsets.UTF_8));
                        } else if (type == 2) {
                            row.add(readBuf.getInt());
                        } else {
                            row.add(null);
                        }
                    }
                    rows.add(row);
                }
                rows.add(newRow);

                // Rewire and write all back
                channel.position(0);
                ByteBuffer writeBuf = ByteBuffer.allocate(10000);
                writeBuf.putInt(colCount);
                for (String col : columns) {
                    byte[] colBytes = col.getBytes(StandardCharsets.UTF_8);
                    writeBuf.putInt(colBytes.length);
                    writeBuf.put(colBytes);
                }
                writeBuf.putInt(rows.size());
                for (List<Object> row : rows) {
                    for (Object val : row) {
                        if (val instanceof String) {
                            writeBuf.put((byte) 1);
                            byte[] valBytes = ((String) val).getBytes(StandardCharsets.UTF_8);
                            writeBuf.putInt(valBytes.length);
                            writeBuf.put(valBytes);
                        } else if (val instanceof Integer) {
                            writeBuf.put((byte) 2);
                            writeBuf.putInt((Integer) val);
                        } else {
                            writeBuf.put((byte) 0);
                        }
                    }
                }
                writeBuf.flip();
                channel.write(writeBuf);
                channel.truncate(channel.position());
            }
        } catch (IOException e) {
            throw new RuntimeException("Failed to insert row", e);
        }

        return new Table(List.of("Result"), List.of(List.of("1 row inserted")));
    }

