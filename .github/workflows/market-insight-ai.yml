name: Market Insight AI V2.1 Build Now

on:
  workflow_dispatch: # Run manually from your phone in GitHub Mobile App

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MI_KEYSTORE_PATH: ${{ github.workspace }}/project/android/ci-release.jks
      MI_KEYSTORE_PASSWORD: ci-market-insight-2026
      MI_KEY_ALIAS: market-insight
      MI_KEY_PASSWORD: ci-market-insight-2026
      MARKET_INSIGHT_API_BASE_URL: https://market-insight-api-v21-production.up.railway.app/
      MARKET_INSIGHT_WS_BASE_URL: wss://market-insight-api-v21-production.up.railway.app/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fix script permissions and line endings
        shell: bash
        run: |
          # Convert Windows CRLF line endings to Linux LF
          find . -type f -name "*.sh" -exec sed -i 's/\r$//' {} + || true
          find . -type f -name "*.sh" -exec chmod +x {} + || true

      - name: Test backend health
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request
          base = "https://market-insight-api-v21-production.up.railway.app"
          try:
              with urllib.request.urlopen(base + "/health", timeout=15) as r:
                  health = json.load(r)
              print("Backend Health Check:", health)
          except Exception as e:
              print("Backend warning:", e)
          PY

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ -d "project" ]; then
            cd project
            if [ -f "setup.py" ] || [ -f "pyproject.toml" ]; then
              python -m pip install -e './backend[dev]' 2>/dev/null || python -m pip install -e '.' 2>/dev/null || true
            fi
            if [ -f "requirements.txt" ]; then
              python -m pip install -r requirements.txt 2>/dev/null || true
            fi
            cd "$GITHUB_WORKSPACE"
          fi

      - name: Generate CI signing keystore
        shell: bash
        run: |
          mkdir -p "${{ github.workspace }}/project/android"
          keytool -genkeypair -v \
            -keystore "$MI_KEYSTORE_PATH" \
            -storepass "$MI_KEYSTORE_PASSWORD" \
            -alias "$MI_KEY_ALIAS" \
            -keypass "$MI_KEY_PASSWORD" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Market Insight AI V2.1 CI, OU=Build, O=Market Insight AI, L=New York, ST=NY, C=US"

      - name: Execute verify_release.sh
        shell: bash
        run: |
          if [ -d "project" ] && [ -f "project/scripts/verify_release.sh" ]; then
            cd project
            ./scripts/verify_release.sh
          elif [ -f "scripts/verify_release.sh" ]; then
            ./scripts/verify_release.sh
          else
            echo "Error: verify_release.sh script not found!"
            exit 1
          fi

      - name: Confirm real APK build outputs
        shell: bash
        run: |
          TARGET_DIR="dist"
          if [ -d "project/dist" ]; then
            TARGET_DIR="project/dist"
          fi

          echo "Checking APKs in $TARGET_DIR..."
          ls -lh "$TARGET_DIR"

          # Verify that files exist and are REAL binaries (>100KB)
          FOUND_APK=0
          for apk in "$TARGET_DIR"/*.apk; do
            if [ -f "$apk" ]; then
              SIZE=$(stat -c%s "$apk" 2>/dev/null || stat -f%z "$apk" 2>/dev/null)
              echo "Found $apk - Size: $SIZE bytes"
              if [ "$SIZE" -lt 100000 ]; then
                echo "ERROR: $apk is too small ($SIZE bytes). It is not a real APK!"
                exit 1
              fi
              FOUND_APK=1
            fi
          done

          if [ "$FOUND_APK" -eq 0 ]; then
            echo "ERROR: No .apk files generated!"
            exit 1
          fi

          cd "$TARGET_DIR"
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MarketInsightAI-v2.1-APK
          path: |
            project/dist/*.apk
            project/dist/SHA256SUMS.txt
            dist/*.apk
            dist/SHA256SUMS.txt
          retention-days: 14
