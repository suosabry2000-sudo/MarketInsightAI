name: Build Market Insight AI APK from Release ZIP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MI_KEYSTORE_PATH: ${{ github.workspace }}/project/android/ci-release.jks
      MI_KEYSTORE_PASSWORD: ci-market-insight-2026
      MI_KEY_ALIAS: market-insight
      MI_KEY_PASSWORD: ci-market-insight-2026
      MARKET_INSIGHT_API_BASE_URL: https://api.example.invalid/
      MARKET_INSIGHT_WS_BASE_URL: wss://api.example.invalid/

    steps:
      - uses: actions/checkout@v4

      - name: Unpack verified release source
        run: |
          test -f MarketInsightAI_V1_RELEASE_CLEAN.zip
          rm -rf project
          mkdir project
          unzip -q MarketInsightAI_V1_RELEASE_CLEAN.zip -d project
          chmod +x project/android/gradlew project/scripts/*.sh

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install backend test dependencies
        working-directory: project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './backend[dev]'

      - name: Generate CI signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$MI_KEYSTORE_PATH" \
            -storepass "$MI_KEYSTORE_PASSWORD" \
            -alias "$MI_KEY_ALIAS" \
            -keypass "$MI_KEY_PASSWORD" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Market Insight AI CI, OU=Build, O=Market Insight AI, L=New York, ST=NY, C=US"

      - name: Verify and build APKs
        working-directory: project
        run: ./scripts/verify_release.sh

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MarketInsightAI-v1
          path: |
            project/dist/MarketInsightAI-debug.apk
            project/dist/MarketInsightAI-v1.0.apk
            project/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
