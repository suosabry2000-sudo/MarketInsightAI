name: Market Insight AI V2.1 Build Now

on:
  workflow_dispatch: # Trigger manually from your phone via GitHub Mobile App

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MI_KEYSTORE_PATH: ${{ github.workspace }}/project/android/ci-release.jks
      MI_KEYSTORE_PASSWORD: ci-market-insight-2026
      MI_KEY_ALIAS: market-insight
      MI_KEY_PASSWORD: ci-market-insight-2026
      MARKET_INSIGHT_API_BASE_URL: https://market-insight-api-v21-production.up.railway.app/
      MARKET_INSIGHT_WS_BASE_URL: wss://market-insight-api-v21-production.up.railway.app/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Inspect Repository Structure
        shell: bash
        run: |
          echo "=== Repository Directory Structure ==="
          find . -maxdepth 3 -not -path '*/.*'

      - name: Test Backend Health
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request
          base = "https://market-insight-api-v21-production.up.railway.app"
          try:
              with urllib.request.urlopen(base + "/health", timeout=15) as r:
                  health = json.load(r)
              print("Backend Health Check:", health)
          except Exception as e:
              print("Backend warning:", e)
          PY

      - name: Install Python Dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Install from any directory that contains setup.py or requirements.txt
          SETUP_PY=$(find . -name "setup.py" -o -name "pyproject.toml" | head -n 1)
          if [ -n "$SETUP_PY" ]; then
            SETUP_DIR=$(dirname "$SETUP_PY")
            echo "Installing Python dependencies from $SETUP_DIR..."
            cd "$SETUP_DIR"
            python -m pip install -e './backend[dev]' 2>/dev/null || python -m pip install -e '.' 2>/dev/null || true
            cd "$GITHUB_WORKSPACE"
          fi
          REQ_TXT=$(find . -name "requirements.txt" | head -n 1)
          if [ -n "$REQ_TXT" ]; then
            python -m pip install -r "$REQ_TXT" 2>/dev/null || true
          fi

      - name: Generate CI Signing Keystore
        shell: bash
        run: |
          mkdir -p "${{ github.workspace }}/project/android"
          mkdir -p "${{ github.workspace }}/android"
          keytool -genkeypair -v \
            -keystore "$MI_KEYSTORE_PATH" \
            -storepass "$MI_KEYSTORE_PASSWORD" \
            -alias "$MI_KEY_ALIAS" \
            -keypass "$MI_KEY_PASSWORD" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Market Insight AI V2.1 CI, OU=Build, O=Market Insight AI, L=New York, ST=NY, C=US"

      - name: Locate and Execute Build Script
        shell: bash
        run: |
          # Sanitize line endings across all shell scripts in the repo
          find . -type f -name "*.sh" -exec sed -i 's/\r$//' {} + 2>/dev/null || true

          # Dynamically locate verify_release.sh anywhere in the repo
          SCRIPT_PATH=$(find . -name "verify_release.sh" -type f | head -n 1)

          if [ -n "$SCRIPT_PATH" ]; then
            echo "Found release script at: $SCRIPT_PATH"
            chmod +x "$SCRIPT_PATH"
            
            # Determine directory where scripts/ folder lives
            SCRIPT_DIR=$(dirname "$SCRIPT_PATH")
            WORKING_DIR=$(dirname "$SCRIPT_DIR")
            
            echo "Executing script in working directory: $WORKING_DIR"
            cd "$WORKING_DIR"
            ./scripts/verify_release.sh
            cd "$GITHUB_WORKSPACE"

          else
            echo "verify_release.sh not found. Searching for Gradle wrapper (gradlew)..."
            GRADLE_PATH=$(find . -name "gradlew" -type f | head -n 1)
            
            if [ -n "$GRADLE_PATH" ]; then
              echo "Found Gradle wrapper at: $GRADLE_PATH"
              chmod +x "$GRADLE_PATH"
              GRADLE_DIR=$(dirname "$GRADLE_PATH")
              cd "$GRADLE_DIR"
              ./gradlew assembleDebug assembleRelease || ./gradlew assembleDebug
              cd "$GITHUB_WORKSPACE"
            else
              echo "ERROR: Neither verify_release.sh nor gradlew was found in the repository!"
              exit 1
            fi
          fi

      - name: Collect and Verify APK Outputs
        shell: bash
        run: |
          mkdir -p dist

          echo "Searching for built .apk files..."
          APK_FILES=$(find . -name "*.apk" -type f -not -path '*/.*')

          if [ -z "$APK_FILES" ]; then
            echo "ERROR: No .apk files were produced by the build step!"
            exit 1
          fi

          echo "Found APK files:"
          echo "$APK_FILES"

          # Copy found APKs into the root dist/ directory
          for apk in $APK_FILES; do
            echo "Copying $apk to dist/"
            cp "$apk" dist/ 2>/dev/null || true
          done

          # Validate APK file sizes (must be a real binary > 100KB)
          for apk in dist/*.apk; do
            if [ -f "$apk" ]; then
              SIZE=$(stat -c%s "$apk" 2>/dev/null || stat -f%z "$apk" 2>/dev/null)
              echo "$apk - Size: $SIZE bytes"
              if [ "$SIZE" -lt 100000 ]; then
                echo "ERROR: $apk is too small ($SIZE bytes). It is not a valid Android package!"
                exit 1
              fi
            fi
          done

          cd dist
          sha256sum *.apk > SHA256SUMS.txt
          echo "=== Final Build Artifacts ==="
          ls -lh
          cat SHA256SUMS.txt

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MarketInsightAI-v2.1-APK
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
          retention-days: 14
