name: Market Insight AI V2.1 Build Now (Web to APK)

on:
  workflow_dispatch: # Allows you to run this manually from the GitHub app on your phone

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java (Required for Android build)
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      # Assuming you have a standard React/Vite app at the root
      - name: Install Web Dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build
        
      # Using Capacitor to package the web build into an Android App
      # (Make sure @capacitor/core, @capacitor/cli, and @capacitor/android are in your package.json)
      - name: Sync Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build APK via Gradle
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Confirm APK outputs
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          echo "=== V2.1 APK Successfully Generated ==="
          ls -lh app/build/outputs/apk/debug/

      - name: Upload V2.1 APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarketInsightAI-v2.1-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
